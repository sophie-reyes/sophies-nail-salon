<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sophie's Nail Salon</title>
<meta name="description" content="Sophie's Nail Salon — a cheerful cartoon nail-salon time-management game!">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="cozy">
<div id="app">

  <!-- ============ TITLE ============ -->
  <section id="screen-title" class="screen">
    <div class="title-keyart">
      <img id="title-keyart-img" src="assets/art/title-keyart.png" alt="Sophie's Nail Salon" onerror="this.style.display='none'">
      <div class="title-keyart-fallback" aria-hidden="true">
        <div class="kb-sign">💅</div>
        <h1>Sophie's<br>Nail Salon</h1>
      </div>
    </div>
    <h1 class="game-title">Sophie's Nail Salon</h1>
    <div class="title-buttons">
      <button id="btn-play" class="btn btn-big btn-pink">▶ Play</button>
      <button id="btn-howto" class="btn btn-white">❓ How to Play</button>
      <button id="btn-mute" class="btn btn-white btn-icon" aria-label="Mute">🔊</button>
      <a id="btn-tip" class="btn btn-white" href="https://buy.stripe.com/4gM3cw2e1dzJgqz4080VO00" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center;">💖 Tip</a>
    </div>
    <div id="tier-card" class="card tier-card"></div>
    <div id="cotd-card" class="card cotd-card"></div>
    <div id="trophies-card" class="card trophies-card"></div>
  </section>

  <!-- ============ DAY INTRO ============ -->
  <section id="screen-dayintro" class="screen hidden">
    <div class="card dayintro-card">
      <h2 id="dayintro-title">Day 1</h2>
      <div id="dayintro-info"></div>
      <div id="dayintro-cotd"></div>
      <div id="dayintro-unlocks"></div>
      <button id="btn-start-day" class="btn btn-big btn-pink">Open the Salon! 💅</button>
      <button id="btn-intro-shop" class="btn btn-white">🛍 Shop</button>
    </div>
  </section>

  <!-- ============ SALON ============ -->
  <section id="screen-salon" class="screen hidden">
    <div class="salon-bg">
      <img src="assets/art/salon-bg.png" alt="" onerror="this.style.display='none'">
      <div class="salon-bg-fallback" aria-hidden="true"></div>
    </div>
    <header id="hud" class="hud">
      <div class="hud-pill hud-timer"><span class="hud-ico">⏱</span><b id="hud-timer">4:00</b></div>
      <div class="hud-pill hud-stars"><span class="hud-ico">⭐</span><b id="hud-daystars">1/3</b></div>
      <div class="hud-pill hud-coins"><span class="hud-ico">🪙</span><b id="hud-coins">0</b><button class="hud-plus" id="btn-plus-coins" aria-label="Get free coins">+</button></div>
      <div class="hud-pill hud-gems"><span class="hud-ico">💎</span><b id="hud-diamonds">0</b><button class="hud-plus" id="btn-plus-diamonds" aria-label="Get gems">+</button></div>
      <button id="btn-settings" class="btn-gear" aria-label="Settings">⚙️</button>
    </header>
    <div id="hud-sub" class="hud-sub">
      <span id="hud-sub-day">📅 Day 1</span>
      <span id="hud-sub-served">😊 0/5</span>
      <span id="hud-sub-tier">🏵 Starter</span>
      <button id="btn-pause" class="btn btn-white btn-icon btn-pause-sm" aria-label="Pause">⏸</button>
    </div>
    <div id="entrance" class="entrance" aria-hidden="true">
      <div class="door">🚪</div>
      <div class="door-label">ENTRANCE</div>
    </div>
    <div id="reception" class="reception" aria-hidden="true">
      <div class="reception-desk"><span class="reception-name">💅 Sophie&rsquo;s Nail Salon</span></div>
    </div>
    <div id="quest-strip" class="quest-strip" role="button" aria-label="Quests" title="Tap to view quests"></div>
    <div id="sophie-host" class="sophie-host">
      <img src="assets/art/sophie.png" alt="Sophie" onerror="this.style.display='none';this.parentNode.classList.add('no-art')">
      <div class="sophie-fallback" aria-hidden="true">💁‍♀️</div>
      <a id="tip-jar" class="tip-jar" href="https://buy.stripe.com/4gM3cw2e1dzJgqz4080VO00" target="_blank" rel="noopener" aria-label="Tip jar — leave Sophie a tip">
        <span class="tip-jar-ico">🫙</span>
        <span class="tip-jar-label">TIP JAR</span>
      </a>
      <div id="sophie-speech" class="speech hidden"></div>
    </div>
    <div id="stations" class="stations"></div>
    <div id="staff-wing" class="staff-wing hidden">
      <div class="staff-wing-label">👥 Your team at work</div>
      <div id="staff-row" class="staff-row"></div>
    </div>
    <div id="waiting" class="waiting">
      <div class="waiting-label">Waiting… tap a customer to seat them!</div>
      <div id="waiting-row" class="waiting-row"></div>
    </div>
    <nav id="action-bar" class="action-bar" aria-label="Salon actions">
      <button id="ab-shop" class="ab-btn ab-shop"><span class="ab-ico">🛍</span><span class="ab-txt">Shop</span></button>
      <button id="ab-quests" class="ab-btn ab-quests"><span class="ab-ico">📋</span><span class="ab-txt">Quests</span><span id="ab-quest-dot" class="ab-dot hidden"></span></button>
      <button id="ab-boost" class="ab-btn ab-boost"><span class="ab-ico">🪙<b class="ab-x2">×2</b></span><span class="ab-txt">BOOST</span><span id="ab-boost-count" class="ab-count">×0</span></button>
      <button id="ab-manager" class="ab-btn ab-locked"><span class="ab-ico">🔒</span><span class="ab-txt">Manager</span></button>
      <button id="ab-spin" class="ab-btn ab-spin"><span class="ab-ico">🎡</span><span class="ab-txt">Spin</span><span id="ab-spin-dot" class="ab-dot hidden"></span></button>
    </nav>
  </section>

  <!-- ============ DAY SUMMARY ============ -->
  <section id="screen-summary" class="screen hidden">
    <div class="card summary-card">
      <h2 id="summary-title">Day 1 Complete!</h2>
      <div id="summary-stars" class="summary-stars"></div>
      <div id="summary-stats"></div>
      <div id="summary-records"></div>
      <button id="btn-double" class="btn btn-big btn-gold">🎬 Double earnings!</button>
      <div class="summary-row">
        <button id="btn-summary-shop" class="btn btn-white">🛍 Shop</button>
        <button id="btn-next-day" class="btn btn-big btn-pink">Next Day →</button>
      </div>
      <div id="summary-teaser" class="teaser"></div>
    </div>
  </section>

  <!-- ============ SHOP ============ -->
  <section id="screen-shop" class="screen hidden">
    <header class="shop-head">
      <button id="btn-shop-back" class="btn btn-white btn-icon" aria-label="Back">←</button>
      <h2>Salon Shop 🛍</h2>
      <div class="hud-item"><span>🪙</span><b id="shop-coins">0</b></div>
    </header>
    <div id="shop-progress" class="card"></div>
    <div id="shop-tabs" class="shop-tabs" role="tablist">
      <button class="tab-btn active" data-tab="upgrades" role="tab">🛠 Upgrades</button>
      <button class="tab-btn" data-tab="staff" role="tab">👥 Staff</button>
      <button class="tab-btn" data-tab="expand" role="tab">🏢 Expand</button>
      <button class="tab-btn" data-tab="style" role="tab">🎨 Style</button>
    </div>
    <div id="tab-upgrades" class="shop-tab"><div id="shop-list"></div></div>
    <div id="tab-staff" class="shop-tab hidden">
      <div id="staff-team" class="card"></div>
      <div id="staff-hire" class="card"></div>
    </div>
    <div id="tab-expand" class="shop-tab hidden"><div id="expand-list"></div></div>
    <div id="tab-style" class="shop-tab hidden">
      <div id="shop-themes" class="card"></div>
      <div id="shop-collection" class="card"></div>
    </div>
  </section>

  <!-- ============ MINI-GAME OVERLAY ============ -->
  <div id="minigame-overlay" class="overlay hidden">
    <div class="mg-panel">
      <div class="mg-head">
        <div id="mg-title">Soak</div>
        <div id="mg-customer">Mia</div>
      </div>
      <div class="mg-timerbar"><div id="mg-timerfill"></div></div>
      <div id="mg-body" class="mg-body"></div>
      <div id="mg-hint" class="mg-hint"></div>
      <button id="mg-done" class="btn btn-pink hidden">Done! ✓</button>
    </div>
  </div>

  <!-- ============ MODAL ============ -->
  <div id="modal" class="overlay hidden">
    <div class="modal-panel card">
      <div id="modal-content"></div>
      <button id="modal-close" class="btn btn-pink">Close</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <div id="confetti-layer"></div>
</div>

<script src="js/platform.js"></script>
<script src="js/audio.js"></script>
<script src="js/data.js"></script>
<script src="js/game.js"></script>
</body>
</html>
